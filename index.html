<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ta-Te-Ti</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contenedor">
        <h1>TaTeTi</h1>

        <!-- Estado del juego y turno actual -->
        <h2 id="estado-juego">Turno del jugador: <span id="jugador-actual">X</span></h2>

        <!-- Tablero de 3x3 -->
        <div class="tablero" id="tablero">
            <button class="celda" data-indice="0"></button>
            <button class="celda" data-indice="1"></button>
            <button class="celda" data-indice="2"></button>
            <button class="celda" data-indice="3"></button>
            <button class="celda" data-indice="4"></button>
            <button class="celda" data-indice="5"></button>
            <button class="celda" data-indice="6"></button>
            <button class="celda" data-indice="7"></button>
            <button class="celda" data-indice="8"></button>
        </div>

        <!-- Botón para reiniciar -->
        <button id="btn-reiniciar" class="btn">Reiniciar Juego</button>
    </main>

    <script src="app.js"></script>
</body>
</html>
